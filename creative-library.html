<title>Creative Library</title>
<style>
:root{
  --bg:#F7F7F7; --card:#FFFFFF; --text:#111111; --muted:#767676; --line:#E4E4E4;
  --hover:#F0F0F0; --btn:#111111; --btn-text:#FFFFFF; --live:#C23A2B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --card:#1C1C1C; --text:#EDEDED; --muted:#9A9A9A; --line:#2C2C2C;
    --hover:#262626; --btn:#EDEDED; --btn-text:#121212; --live:#E8705E;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --card:#1C1C1C; --text:#EDEDED; --muted:#9A9A9A; --line:#2C2C2C;
  --hover:#262626; --btn:#EDEDED; --btn-text:#121212; --live:#E8705E;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0}

/* header */
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
  padding:12px 20px;display:flex;align-items:center;gap:14px}
header h1{font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.search{flex:1;max-width:520px;margin:0 auto;position:relative;display:flex;align-items:center}
.search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:22px;
  background:var(--card);font-size:14px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:14px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:9px 16px;
  cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn-dark{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
.btn-dark:hover{opacity:.85;background:var(--btn)}

/* tabs */
.tabs{display:flex;gap:4px;padding:10px 20px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:20px;cursor:pointer;
  font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button:hover{background:var(--hover);color:var(--text)}
.tabs button[aria-current="page"]{background:var(--btn);color:var(--btn-text)}
.tabs .count{opacity:.6;margin-left:4px;font-weight:500}

/* filters */
.filters{display:flex;gap:8px;padding:14px 20px;flex-wrap:wrap;align-items:center}
.pills{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px}
.pills button{border:0;background:none;border-radius:16px;padding:6px 14px;cursor:pointer;font-size:13.5px;
  font-weight:600;color:var(--muted)}
.pills button:hover{color:var(--text)}
.pills button[aria-pressed="true"]{background:var(--btn);color:var(--btn-text)}
.filters select{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px;
  font-size:13.5px;font-weight:600;cursor:pointer;color:var(--text)}
.filters .clear{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13.5px;
  text-decoration:underline;padding:6px}
.filters .clear:hover{color:var(--text)}
.result{color:var(--muted);font-size:13.5px;margin-left:auto}

/* board */
.board{padding:6px 20px 60px;columns:5;column-gap:16px}
@media(max-width:1500px){.board{columns:4}}
@media(max-width:1180px){.board{columns:3}}
@media(max-width:820px){.board{columns:2}}
.card{break-inside:avoid;margin:0 0 22px;cursor:pointer;position:relative}
.pic{position:relative;border-radius:14px;overflow:hidden;display:block}
.card:hover .pic::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.2)}
.card .save{position:absolute;top:10px;right:10px;z-index:3;opacity:0;background:var(--live);color:#fff;
  border:0;border-radius:18px;padding:8px 14px;font-size:13.5px;font-weight:700;cursor:pointer}
.card:hover .save,.card:focus-within .save{opacity:1}
.card .save[data-saved="true"]{opacity:1;background:var(--btn);color:var(--btn-text)}
.card .info{padding:8px 4px 0}
.card .hook{font-size:14px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.card .sub{font-size:13px;color:var(--muted);margin-top:2px}

/* thumbnails: flat colour, hook, nothing else */
.pic .art{position:relative;display:flex;align-items:flex-end;padding:16px;color:#fff}
.pic.r916 .art{aspect-ratio:9/16}.pic.r45 .art{aspect-ratio:4/5}.pic.r11 .art{aspect-ratio:1/1}
.art .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 45%,rgba(0,0,0,.45))}
.art .txt{position:relative;font-size:17px;font-weight:700;line-height:1.2;letter-spacing:-.02em;max-width:15ch}
.art .shape{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:42%;aspect-ratio:1;
  border-radius:50%;background:rgba(255,255,255,.18)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pic .imgwrap{position:relative;background:var(--hover)}
.pic.r916 .imgwrap{aspect-ratio:9/16}.pic.r45 .imgwrap{aspect-ratio:4/5}.pic.r11 .imgwrap{aspect-ratio:1/1}
.f .drop{border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);
  font-size:13px;cursor:pointer;background:var(--bg)}
.f .drop:hover{border-color:var(--text);color:var(--text)}
.f .drop.has{border-style:solid;padding:0;overflow:hidden}
.f .drop img{width:100%;max-height:150px;object-fit:cover;display:block}
.art .shape.box{border-radius:10px;width:34%;aspect-ratio:.6;background:rgba(255,255,255,.26)}
.play{position:absolute;top:10px;left:10px;z-index:2;background:rgba(0,0,0,.45);color:#fff;border-radius:14px;
  padding:3px 9px;font-size:12px;font-weight:600;display:flex;gap:5px;align-items:center}
.livetag{position:absolute;top:10px;left:10px;z-index:2;background:var(--live);color:#fff;border-radius:14px;
  padding:3px 10px;font-size:12px;font-weight:700}

.art .txt{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.why b{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
.f label i{color:var(--live);font-style:normal}
.f label .opt{color:var(--muted);font-weight:500;margin-left:4px}
.f .err{display:none;color:var(--live);font-size:12.5px}
.f.bad .err{display:block}
.f.bad input,.f.bad select,.f.bad textarea,select.bad{border-color:var(--live)}
.f #a-url{margin-top:6px}
.slackhead{padding:4px 20px 0;max-width:760px;color:var(--muted);font-size:14px}
.slackhead p{margin:0 0 8px}
.slackhead b{color:var(--text)}
.slackhead code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--card);
  border:1px solid var(--line);border-radius:6px;padding:2px 7px;margin-right:4px;color:var(--text)}
mark{background:#FFE58A;color:#111;border-radius:3px;padding:0 2px}
.item .filed{font-size:13px;color:var(--muted)}
.chip{font-size:12.5px;font-weight:600;background:var(--hover);border-radius:12px;padding:3px 10px}
.item .missing{font-size:12.5px;color:var(--live);margin:-6px 0 10px}
.item.done .said{margin-bottom:10px}

.art .sbar{position:absolute;left:9%;right:9%;top:28%;background:#fff;color:#333;border-radius:999px;
  padding:8px 12px;font-size:12px;display:flex;gap:7px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.28);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art .sbar svg{flex:0 0 auto;color:#888}
.art .qbox{position:absolute;left:13%;right:13%;top:24%;background:#fff;color:#111;border-radius:14px;
  overflow:hidden;text-align:center;display:flex;flex-direction:column;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.art .qbox .qh{background:linear-gradient(90deg,#7B5CFF,#E1306C);color:#fff;font-size:10.5px;font-weight:700;padding:7px 8px}
.art .qbox .qq{padding:11px 10px 13px;font-size:13px;font-weight:600;line-height:1.3}
.subtabs{display:flex;gap:4px;padding:6px 20px 4px}
.subtabs button{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:6px 14px;
  cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.subtabs button:hover{color:var(--text)}
.subtabs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
.subtabs .n{opacity:.6;font-weight:500;margin-left:4px}
.tile .empty{height:150px;border-radius:14px;border:1px dashed var(--line);display:flex;align-items:center;
  justify-content:center;color:var(--muted);font-size:13px}

/* boards */
.tiles{padding:0 20px 24px;display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tile{background:none;border:0;padding:0;cursor:pointer;text-align:left}
.tile .cover{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:3px;height:150px;
  border-radius:14px;overflow:hidden}
.tile .cover > *{position:relative;overflow:hidden;background:var(--hover)}
.tile .cover > *:first-child{grid-row:span 2}
.tile .cover.n1 > *{grid-column:1/-1}
.tile .cover.n2 > *:nth-child(2){grid-row:span 2}
.tile .cover .pic{position:absolute;inset:0;border-radius:0}
.tile .cover .art,.tile .cover .imgwrap{position:absolute;inset:0;aspect-ratio:auto!important;padding:0}
.tile:hover .cover{opacity:.85}
.section{padding:18px 20px 10px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.section span{color:var(--muted);font-weight:500;margin-left:6px}
.tile h3{font-size:15px;font-weight:700;margin-top:9px;letter-spacing:-.01em}
.tile .sub{font-size:13px;color:var(--muted);margin-top:1px}

/* slack list */
.list{padding:6px 20px 60px;display:flex;flex-direction:column;gap:12px;max-width:760px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
  display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start}
.item .pic{border-radius:10px}
.item .who{font-size:13px;color:var(--muted)}
.item .who b{color:var(--text);font-weight:600}
.item .said{font-size:14.5px;margin:6px 0 12px;line-height:1.45}
.item .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item select{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:6px 12px;font-size:13px}
.item .acts .gap{flex:1}
.blank{padding:60px 20px;color:var(--muted);text-align:center}
.blank b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.note-line{padding:0 20px 14px;color:var(--muted);font-size:13.5px;max-width:70ch}

/* detail */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
.sheet{position:fixed;z-index:21;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);
  border-radius:18px;width:min(820px,calc(100vw - 32px));max-height:88vh;overflow:auto;
  display:grid;grid-template-columns:minmax(0,1fr) 320px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet .left{background:var(--hover);display:flex;align-items:center;justify-content:center;padding:20px}
.sheet .left .pic{width:100%;max-width:280px}
.sheet .right{padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:21px;letter-spacing:-.02em;line-height:1.25;padding-right:28px}
.sheet .meta{font-size:14px;color:var(--muted)}
.sheet .why{font-size:14px;line-height:1.55;background:var(--bg);border-radius:12px;padding:12px 14px}
.sheet .why span{display:block;color:var(--muted);font-size:12.5px;margin-top:8px}
.nums{display:flex;gap:18px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
.nums div b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.nums div span{font-size:12.5px;color:var(--muted)}
.sheet .close{position:absolute;top:10px;right:12px;border:0;background:var(--card);border-radius:50%;
  width:32px;height:32px;font-size:19px;cursor:pointer;line-height:1}
.sheet .close:hover{background:var(--hover)}
.modal{position:fixed;z-index:21;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);
  border-radius:18px;padding:22px;width:min(420px,calc(100vw - 32px));display:flex;flex-direction:column;gap:12px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:88vh;overflow:auto}
.modal h2{font-size:19px;letter-spacing:-.02em}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:13px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;
  background:var(--bg);font-family:inherit;font-size:14px}
.f textarea{resize:vertical;min-height:54px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;background:var(--btn);
  color:var(--btn-text);padding:11px 18px;border-radius:24px;font-size:14px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:700px){
  .sheet{grid-template-columns:1fr}
  header{flex-wrap:wrap}
  .search{order:3;flex-basis:100%;max-width:none;margin:4px 0 0}
}
</style>

/* ---------- vocab ---------- */
const INDUSTRIES=["Beauty","Finance","Fintech","Food & bev","Home","Primer Growth","Wellness"];
const THEMES=["UGC","Vs the alt","Facts + Stats","This or that","Copy only","Reviews/Testimonials",
  "BDQs","Search bar","Question box/comment response","Organic"];

/* Keywords people type in Slack → where the post gets filed. First match wins. */
const KEYWORDS={
  industry:{
    "Primer Growth":["primer growth","primer"],
    "Beauty":["beauty","skincare","skin","makeup","lip","serum","cosmetic"],
    "Fintech":["fintech","payments","neobank"],
    "Finance":["finance","bank","banking","savings","apy","loan","credit"],
    "Wellness":["wellness","supplement","supplements","vitamin","greens","health"],
    "Food & bev":["food","snack","drink","protein","bev","cpg"],
    "Home":["home","cleaning","rug","vacuum","furniture","decor"]
  },
  theme:{
    "Question box/comment response":["question box","comment","comments","reply","replying"],
    "Search bar":["search bar","search","google"],
    "Reviews/Testimonials":["review","reviews","testimonial","testimonials"],
    "This or that":["this or that","before/after","before and after","before after"],
    "Vs the alt":["vs the alt","vs","versus","alternative","compared"],
    "Facts + Stats":["facts","fact","stats","stat","numbers","data"],
    "Copy only":["copy only","copy","text only","type only"],
    "BDQs":["bdq","bdqs"],
    "Organic":["organic","lofi","lo-fi","native"],
    "UGC":["ugc","creator","talking head","pov","fyp","founder"]
  }
};
function tag(text,clients){
  const t=" "+text.toLowerCase().replace(/#/g," ").replace(/[—–,.!?:;()]/g," ").replace(/\s+/g," ")+" ";
  const has=w=>t.includes(" "+w+" ");
  const pick=map=>Object.keys(map).find(k=>map[k].some(has))||"";
  const client=(clients||[]).find(c=>has(c.toLowerCase())||has(c.toLowerCase().split(" ")[0]))||"";
  return {industry:pick(KEYWORDS.industry),theme:pick(KEYWORDS.theme),client};
}

const STORE="creative-library-simple";
const R={"9:16":"r916","4:5":"r45","1:1":"r11"};
let DATA=[],INBOX=[],SAVED=new Set();
let S={view:"all",type:"all",industry:"",theme:"",client:"",q:""};
let AUTO=[];

function saved(){try{return JSON.parse(localStorage.getItem(STORE)||"{}")}catch(e){return{}}}
function store(patch){try{localStorage.setItem(STORE,JSON.stringify(Object.assign(saved(),patch)))}catch(e){}}
(function(){
  const p=saved();
  DATA=[...(p.added||[]),...SEED];
  DATA.forEach(d=>{ if(!THEMES.includes(d.theme)) d.theme="UGC"; });
  const gone=new Set(p.cleared||[]);
  const clients=[...new Set(DATA.map(d=>d.client))];
  // Slack posts that name an industry and a theme file themselves; the rest wait for a person.
  for(const it of INBOX_SEED){
    if(gone.has(it.id)) continue;
    it.tags=tag(it.msg,clients);
    if(it.tags.industry&&it.tags.theme){
      const item=fromSlack(it,it.tags);item.auto=true;
      DATA.push(item);AUTO.push(item);
    } else INBOX.push(it);
  }
  SAVED=new Set(p.saved||[]);
})();

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uniq=k=>[...new Set(DATA.map(d=>d[k]))].sort();
const industries=()=>[...new Set([...INDUSTRIES,...DATA.map(d=>d.industry)])].filter(x=>x&&x!=="Unsorted").sort();
function fromSlack(it,t){
  return {id:"s-"+it.id,client:t.client||"",industry:t.industry,theme:t.theme,type:it.type,source:"Slack",
    layout:it.layout,hook:it.hook,fmt:it.fmt,dur:it.dur||"",spend:"—",ctr:"—",hookRate:"—",days:0,
    added:"2026-09-2"+(it.id.slice(-1)%4),by:it.who+" in "+it.ch,note:it.msg,c1:it.c1,c2:it.c2};
}
const wks=d=>Math.max(1,Math.round(d.days/7));
const stage=document.getElementById("stage");

/* one simple thumbnail: flat colour, the hook, a play badge if it's video */
function pic(d,opts){
  opts=opts||{};
  const badges=`
      ${(!opts.plain&&d.type==="video")?`<span class="play">▶ ${esc(d.dur||"")}</span>`:""}
      ${(!opts.plain&&d.source==="Competitor scan")?`<span class="livetag" style="${d.type==="video"?"top:40px":""}">Live ${wks(d)} wks</span>`:""}`;
  // A real screenshot or export of the ad, when we have one.
  if(d.img) return `<div class="pic ${R[d.fmt]||"r45"}">
      <div class="imgwrap"><img src="${esc(d.img)}" alt="${esc(d.hook)}" loading="lazy">${badges}</div>
    </div>`;
  // Otherwise: a stand-in, so the board still reads while assets are being imported.
  const shape=d.layout==="product"?'<span class="shape box"></span>'
            :(d.layout==="ugc"||d.layout==="split")?'<span class="shape"></span>'
            :d.layout==="search"?`<span class="sbar"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>${esc(d.query||d.hook)}</span>`
            :d.layout==="qbox"?`<span class="qbox"><span class="qh">Ask me a question</span><span class="qq">${esc(d.question||d.hook)}</span></span>`:"";
  return `<div class="pic ${R[d.fmt]||"r45"}">
    <div class="art" style="background:${d.c1}">
      <span class="shade"></span>${shape}
      ${opts.plain?"":`<span class="txt">${esc(d.hook)}</span>`}
      ${badges}
    </div></div>`;
}

function shown(){
  return DATA.filter(d=>{
    if(S.type!=="all"&&d.type!==S.type)return false;
    if(S.industry&&d.industry!==S.industry)return false;
    if(S.theme&&d.theme!==S.theme)return false;
    if(S.client&&d.client!==S.client)return false;
    if(S.q){
      const hay=(d.hook+" "+d.client+" "+d.industry+" "+d.theme+" "+d.note).toLowerCase();
      if(!hay.includes(S.q))return false;
    }
    return true;
  }).sort((a,b)=>b.added.localeCompare(a.added));
}

function go(v){
  if(v)S.view=v;
  document.querySelectorAll("#tabs button").forEach(b=>{
    if(b.dataset.view===S.view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
  });
  document.getElementById("n-slack").textContent=INBOX.length?" "+INBOX.length:"";
  draw();
}

function draw(){
  stage.innerHTML="";
  if(S.view==="all")viewAll();
  else if(S.view==="boards")viewBoards();
  else if(S.view==="slack")viewSlack();
  else viewComp();
}

/* ---- all creative ---- */
function viewAll(){
  const f=document.createElement("div");
  f.className="filters";
  f.innerHTML=`
    <div class="pills">
      <button data-t="all" aria-pressed="${S.type==="all"}">All</button>
      <button data-t="static" aria-pressed="${S.type==="static"}">Images</button>
      <button data-t="video" aria-pressed="${S.type==="video"}">Video</button>
    </div>
    <select id="f-ind"><option value="">All industries</option>${industries().map(v=>`<option ${v===S.industry?"selected":""}>${esc(v)}</option>`).join("")}</select>
    <select id="f-thm"><option value="">All themes</option>${THEMES.map(v=>`<option ${v===S.theme?"selected":""}>${esc(v)}</option>`).join("")}</select>
    <select id="f-cli"><option value="">All clients</option>${uniq("client").filter(Boolean).map(v=>`<option ${v===S.client?"selected":""}>${esc(v)}</option>`).join("")}</select>
    ${(S.type!=="all"||S.industry||S.theme||S.client||S.q)?`<button class="clear">Clear</button>`:""}`;
  f.querySelectorAll(".pills button").forEach(b=>b.addEventListener("click",()=>{S.type=b.dataset.t;draw()}));
  f.querySelector("#f-ind").addEventListener("change",e=>{S.industry=e.target.value;draw()});
  f.querySelector("#f-thm").addEventListener("change",e=>{S.theme=e.target.value;draw()});
  f.querySelector("#f-cli").addEventListener("change",e=>{S.client=e.target.value;draw()});
  const c=f.querySelector(".clear");
  if(c)c.addEventListener("click",()=>{S.type="all";S.industry="";S.theme="";S.client="";S.q="";document.getElementById("q").value="";draw()});
  const items=shown();
  const r=document.createElement("span");
  r.className="result";r.textContent=items.length+(items.length===1?" creative":" creatives");
  f.appendChild(r);
  stage.appendChild(f);

  const board=document.createElement("div");
  board.className="board";
  if(!items.length){
    board.style.columns="1";
    board.innerHTML=`<div class="blank"><b>Nothing here yet</b>Try clearing a filter, or add a creative.</div>`;
  } else items.forEach((d,i)=>board.appendChild(card(d,items,i)));
  stage.appendChild(board);
}

function card(d,list,i){
  const el=document.createElement("div");
  el.className="card";el.tabIndex=0;el.setAttribute("role","button");
  el.setAttribute("aria-label",d.hook+", "+(d.client||d.industry));
  el.innerHTML=pic(d)+`
    <button class="save" type="button" data-saved="${SAVED.has(d.id)}">${SAVED.has(d.id)?"Saved":"Save"}</button>
    <div class="info">
      <div class="hook">${esc(d.client||d.industry)}</div>
      <div class="sub">${[d.client?d.industry:"",d.theme].filter(Boolean).map(esc).join(" · ")}</div>
    </div>`;
  const open=()=>detail(d,list,i);
  el.addEventListener("click",e=>{if(!e.target.closest(".save"))open()});
  el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});
  el.querySelector(".save").addEventListener("click",()=>{
    SAVED.has(d.id)?SAVED.delete(d.id):SAVED.add(d.id);
    store({saved:[...SAVED]});
    toast(SAVED.has(d.id)?"Saved":"Removed");draw();
  });
  return el;
}

/* ---- boards ---- */
const BOARD_TABS=[["industry","Industries"],["theme","Themes"],["client","Clients"]];
function viewBoards(){
  const key=S.boardBy||"industry";
  const groupsFor=k=>k==="theme"?THEMES.slice()
    :k==="industry"?industries()
    :uniq("client").filter(Boolean);
  const tabs=document.createElement("div");tabs.className="subtabs";tabs.setAttribute("role","group");
  tabs.innerHTML=BOARD_TABS.map(([k,label])=>
    `<button data-k="${k}" aria-pressed="${k===key}">${label}<span class="n">${groupsFor(k).length}</span></button>`).join("");
  tabs.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{S.boardBy=b.dataset.k;draw()}));
  stage.appendChild(tabs);

  const count=g=>DATA.filter(d=>d[key]===g).length;
  // Themes keep the order they were defined in; industries and clients go biggest first.
  const groups=key==="theme"?groupsFor(key):groupsFor(key).sort((a,b)=>count(b)-count(a)||a.localeCompare(b));
  const grid=document.createElement("div");grid.className="tiles";grid.style.paddingTop="14px";
  for(const g of groups){
    const items=DATA.filter(d=>d[key]===g);
    const t=document.createElement("button");t.className="tile";t.type="button";
    t.innerHTML=`${items.length?`<div class="cover n${Math.min(items.length,3)}">${items.slice(0,3).map(p=>`<div>${pic(p,{plain:true})}</div>`).join("")}</div>`
        :`<div class="empty">Nothing filed yet</div>`}
      <h3>${esc(g)}</h3>
      <div class="sub">${items.length} creative${items.length===1?"":"s"}</div>`;
    t.addEventListener("click",()=>{
      S.industry=key==="industry"?g:"";S.theme=key==="theme"?g:"";S.client=key==="client"?g:"";S.type="all";
      go("all");window.scrollTo({top:0});
    });
    grid.appendChild(t);
  }
  stage.appendChild(grid);
}

/* ---- from Slack ---- */
function highlight(msg,clients){
  let h=esc(msg);
  const words=[...Object.values(KEYWORDS.industry).flat(),...Object.values(KEYWORDS.theme).flat(),
    ...clients.map(c=>c.toLowerCase())].sort((a,b)=>b.length-a.length);
  for(const w of words){
    const re=new RegExp("(^|[\\s#])("+w.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&")+")(?=$|[\\s,.—–!?:;])","gi");
    h=h.replace(re,(m,pre,word)=>pre+"<mark>"+word+"</mark>");
  }
  return h;
}

  stage.appendChild(head);

  if(AUTO.length){
    const h=document.createElement("h2");h.className="section";
    h.innerHTML=`Filed automatically<span>${AUTO.length}</span>`;
    const wrap=document.createElement("div");wrap.className="list";
    AUTO.forEach((d,i)=>{
      const row=document.createElement("div");row.className="item done";
      row.innerHTML=`${pic(d,{plain:true})}
        <div>
          <div class="who">${esc(d.by)}</div>
          <div class="said">${highlight(d.note,clients)}</div>
          <div class="acts">
            <span class="filed">Filed to</span>
            <span class="chip">${esc(d.industry)}</span><span class="chip">${esc(d.theme)}</span>
            ${d.client?`<span class="chip">${esc(d.client)}</span>`:""}
            <span class="gap"></span>
            <button class="btn" data-a="view">View</button>
          </div>
        </div>`;
      row.querySelector('[data-a="view"]').addEventListener("click",()=>detail(d,AUTO,i));
      wrap.appendChild(row);
    });
    stage.append(h,wrap);
  }

  const h2=document.createElement("h2");h2.className="section";
  h2.innerHTML=`Needs a look<span>${INBOX.length}</span>`;
  stage.appendChild(h2);
  const wrap=document.createElement("div");wrap.className="list";
  if(!INBOX.length){
    wrap.innerHTML=`<div class="blank"><b>All caught up</b>Every post in #creative-inspiration has been filed.</div>`;
    stage.appendChild(wrap);return;
  }
  for(const it of INBOX){
    const t=it.tags||tag(it.msg,clients);
    const row=document.createElement("div");row.className="item";
    row.innerHTML=`${pic(Object.assign({},it),{plain:true})}
      <div>
        <div class="who"><b>${esc(it.who)}</b> in ${esc(it.ch)} · ${esc(it.time)}</div>
        <div class="said">${highlight(it.msg,clients)}</div>
        <div class="missing">No ${[!t.industry&&"industry",!t.theme&&"theme"].filter(Boolean).join(" or ")} in the message</div>
        <div class="acts">
          <select aria-label="Industry" data-k="industry"><option value="">Industry *</option>${industries().map(c=>`<option ${c===t.industry?"selected":""}>${esc(c)}</option>`).join("")}</select>
          <select aria-label="Creative theme" data-k="theme"><option value="">Theme *</option>${THEMES.map(c=>`<option ${c===t.theme?"selected":""}>${esc(c)}</option>`).join("")}</select>
          <select aria-label="Client"><option value="">Client (optional)</option>${clients.map(c=>`<option ${c===t.client?"selected":""}>${esc(c)}</option>`).join("")}</select>
          <span class="gap"></span>
          <button class="btn" data-a="skip">Skip</button>
          <button class="btn btn-dark" data-a="add">File it</button>
        </div>
      </div>`;
    const [si,st,sc]=row.querySelectorAll("select");
    [si,st].forEach(x=>x.addEventListener("change",()=>x.classList.remove("bad")));
    row.querySelector('[data-a="skip"]').addEventListener("click",()=>{drop(it.id);toast("Skipped")});
    row.querySelector('[data-a="add"]').addEventListener("click",()=>{
      si.classList.toggle("bad",!si.value);st.classList.toggle("bad",!st.value);
      if(!si.value||!st.value){toast("Pick an industry and a theme first");return;}
      const item=fromSlack(it,{industry:si.value,theme:st.value,client:sc.value});
      DATA.unshift(item);store({added:[item,...(saved().added||[])]});
      drop(it.id);toast("Filed to "+item.industry+" · "+item.theme);
    });
    wrap.appendChild(row);
  }
  stage.appendChild(wrap);
}
function drop(id){
  INBOX=INBOX.filter(i=>i.id!==id);
  store({cleared:[...(saved().cleared||[]),id]});
  go();
}

/* ---- detail ---- */
let open_=null,ctx=null;
function shut(){if(!open_)return;open_.forEach(n=>n.remove());open_=null;ctx=null;document.removeEventListener("keydown",key)}
function key(e){
  if(e.key==="Escape")return shut();
  if(!ctx)return;
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
    const j=(ctx.i+(e.key==="ArrowRight"?1:-1)+ctx.list.length)%ctx.list.length;
    detail(ctx.list[j],ctx.list,j);
  }
}
function put(node){
  shut();
  const s=document.createElement("div");s.className="scrim";s.addEventListener("click",shut);
  document.body.append(s,node);open_=[s,node];
  document.addEventListener("keydown",key);
  const f=node.querySelector("button,input,select");if(f)f.focus();
}
function detail(d,list,i){
  const el=document.createElement("div");
  el.className="sheet";el.setAttribute("role","dialog");el.setAttribute("aria-label",d.hook);
  const nums=[];
  if(d.spend&&d.spend!=="—")nums.push(["Spend",d.spend]);
  if(d.ctr&&d.ctr!=="—")nums.push(["CTR",d.ctr]);
  if(d.hookRate&&d.hookRate!=="—")nums.push(["Hook rate",d.hookRate]);
  if(!nums.length)nums.push(["Live",wks(d)+" weeks"]);
  el.innerHTML=`
    <button class="close" aria-label="Close">×</button>
    <div class="left">${pic(d)}</div>
    <div class="right">
      <h2>${esc(d.hook)}</h2>
      <div class="meta">${[d.client,d.industry,d.theme,d.type==="video"?"Video "+d.dur:"Image",d.fmt].filter(Boolean).map(esc).join(" · ")}</div>
      <div class="nums">${nums.map(n=>`<div><b>${esc(n[1])}</b><span>${esc(n[0])}</span></div>`).join("")}</div>
      ${d.note?`<div class="why"><b>What's good</b>${esc(d.note)}<span>${esc(d.by)} · ${esc(d.added)}</span></div>`
              :`<div class="meta">${esc(d.by)} · ${esc(d.added)}</div>`}
      <button class="btn" data-a="save">${SAVED.has(d.id)?"Saved":"Save"}</button>
      <button class="btn" data-a="more">More ${d.client?"from "+esc(d.client):esc(d.theme)}</button>
    </div>`;
  el.querySelector(".close").addEventListener("click",shut);
  el.querySelector('[data-a="save"]').addEventListener("click",()=>{
    SAVED.has(d.id)?SAVED.delete(d.id):SAVED.add(d.id);
    store({saved:[...SAVED]});draw();detail(d,list,i);
  });
  el.querySelector('[data-a="more"]').addEventListener("click",()=>{
    S.client=d.client||"";S.theme=d.client?"":d.theme;S.industry="";S.type="all";shut();go("all");window.scrollTo({top:0});
  });
  put(el);ctx={list:list||[d],i:i||0};
}

/* Browser storage is small, so a picked file is resized before it is kept. */
function shrink(file,max,done){
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement("canvas");
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      try{done(c.toDataURL("image/jpeg",.82))}catch(e){done(r.result)}
    };
    im.onerror=()=>done(r.result);
    im.src=r.result;
  };
  r.readAsDataURL(file);
}

let tt=null;
function toast(msg){
  document.querySelectorAll(".toast").forEach(n=>n.remove());

  document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(()=>t.remove(),2400);
}
