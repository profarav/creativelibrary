<title>Sign in · Creative Library</title>
<style>
:root{--bg:#F7F7F7;--card:#FFFFFF;--text:#111111;--muted:#767676;--line:#E4E4E4;--btn:#111111;--btn-text:#FFFFFF;--live:#C23A2B}
@media (prefers-color-scheme: dark){:root{--bg:#121212;--card:#1C1C1C;--text:#EDEDED;--muted:#9A9A9A;--line:#2C2C2C;--btn:#EDEDED;--btn-text:#121212;--live:#E8705E}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:20px}
form{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:22px;letter-spacing:-.02em}
p{margin:-6px 0 4px;color:var(--muted);font-size:14px;line-height:1.45}
label{font-size:13px;font-weight:600;color:var(--muted)}
input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font:inherit;font-size:15px;background:var(--bg);color:var(--text);margin-top:5px}
input:focus{outline:2px solid var(--text);outline-offset:1px}
button{border:0;border-radius:22px;background:var(--btn);color:var(--btn-text);font:inherit;font-weight:700;font-size:15px;padding:12px;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--live);font-size:13.5px;min-height:1em}
</style>
<form id="f" novalidate>
  <h1>Creative Library</h1>
  <p>Every ad worth remembering, in one place. Sign in with your Primer email.</p>
  <label for="email">Work email
    <input id="email" type="email" autocomplete="email" placeholder="you@goprimer.com" required autofocus>
  </label>
  <div class="err" id="err" role="alert"></div>
  <button id="go" type="submit">Continue</button>
</form>
<script>
const f=document.getElementById("f"),err=document.getElementById("err"),go=document.getElementById("go");
f.addEventListener("submit",async e=>{
  e.preventDefault();err.textContent="";
  const email=document.getElementById("email").value.trim();
  if(!/@goprimer\./i.test(email)){err.textContent="Use your Primer email — it should end in @goprimer.com.";return}
  go.disabled=true;go.textContent="Signing in…";
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||"Couldn't sign you in. Try again.");
    const next=new URLSearchParams(location.search).get("next");
    location.href=next&&next.startsWith("/")&&!next.startsWith("//")?next:"/";
  }catch(x){err.textContent=x.message;go.disabled=false;go.textContent="Continue"}
});
</script>
